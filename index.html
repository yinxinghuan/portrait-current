<!doctype html>
<html lang="zh-CN">
  <head>
    <meta name="game-uuid" content="788f549a-c79f-45ce-a9c6-67318b717bdb" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Portrait Current</title>
    <style id="alteru-long-press-guard">html,body,#app,#root{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}input,textarea,[contenteditable="true"]{-webkit-touch-callout:default;-webkit-user-select:text;user-select:text}img,svg,canvas{-webkit-user-drag:none}</style>
    <style>
      html,body{margin:0;min-height:100%;background:#050505}
      .boot-bridge{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#050505;color:#f5f5f5;pointer-events:auto;transition:opacity .32s ease,visibility .32s}
      .boot-bridge.is-ready{opacity:0;visibility:hidden;pointer-events:none}
      .boot-bridge__core{text-align:center;font:700 10px/1.3 ui-monospace,monospace;letter-spacing:.22em}
      .boot-bridge__mark{width:70px;height:70px;margin:0 auto 18px;background:radial-gradient(circle,#fff 0 2px,transparent 3px) 0 0/10px 10px;mask-image:radial-gradient(circle,#000 45%,transparent 72%);animation:pc-boot 1.1s linear infinite}
      @keyframes pc-boot{to{transform:rotate(18deg) scale(.88);opacity:.5}}
      @media(prefers-reduced-motion:reduce){.boot-bridge__mark{animation:none}}
    </style>
    <script src="https://images.aiwaves.tech/alteru/guest-shell.js" defer></script>
  </head>
  <body>
    <div class="boot-bridge" role="status" aria-live="polite"><div class="boot-bridge__core"><div class="boot-bridge__mark" aria-hidden="true"></div>PORTRAIT CURRENT</div></div>
    <main>
      <div class="stage" aria-label="Interactive portrait particles"></div>
      <header class="hud">
        <p>PORTRAIT CURRENT</p>
        <div class="coverage" aria-label="Explored portrait cells"></div>
      </header>
      <div class="loading">正在读取头像粒子…</div>
      <footer class="guide">
        <p>划过头像，唤醒像素电流</p>
        <button type="button" hidden>重新发现</button>
      </footer>
      <a class="credit" href="https://github.com/brunoimbrizi/interactive-particles" target="_blank" rel="noreferrer">Original: Bruno Imbrizi / Codrops</a>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
